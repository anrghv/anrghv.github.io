title: "Anuj Raghav"
tagline: "Experimental High Energy Physics"
description: >-
  Anuj Raghav — PhD student in Experimental High Energy Physics at the
  University of Delhi, working with the CMS Experiment at CERN.
author: "Anuj Raghav"
email: anuj.ehep@gmail.com
url: "https://anrghv.github.io"
baseurl: ""

# ── Identity ───────────────────────────────────────────
# Drives the structured data (schema.org Person) and the social preview card.
identity:
  job_title: "PhD Student, Experimental High Energy Physics"
  location: "Delhi, India"
  affiliation: "University of Delhi"
  experiment: "CMS Experiment, CERN"
  orcid: "0009-0004-6667-0434"
  image: "/Images/image.jpeg"
  same_as:
    - "https://github.com/anrghv"
    - "https://www.linkedin.com/in/anuj-raghav252"
    - "https://orcid.org/0009-0004-6667-0434"
  knows_about:
    - "Higgs physics"
    - "Machine learning in high energy physics"
    - "Beyond Standard Model searches"
    - "HEP computing"
    - "Open science"

# Social preview image, 1200×630. Rebuild with tools/make-og-image.md
og_image: "/assets/img/og.png"

# ── Build ──────────────────────────────────────────────
markdown: kramdown
permalink: pretty
kramdown:
  input: GFM
  syntax_highlighter: rouge
  smart_quotes: lsquo,rsquo,ldquo,rdquo
sass:
  style: compressed
plugins:
  - jekyll-feed
  - jekyll-sitemap

# ── Navigation ─────────────────────────────────────────
# Edit this list to add/remove/reorder nav items — nothing else to touch.
nav:
  - title: "About"
    url: /
  - title: "Research"
    url: /research/
  - title: "Publications"
    url: /publications/
  - title: "CV"
    url: /cv/
  - title: "Contact"
    url: /contact/

# ── Collections ────────────────────────────────────────
# Add a talk: drop a new file in _talks/, front matter only, no layout needed.
# Add a publication: same idea in _publications/.
collections:
  research:
    output: false
  talks:
    output: false
  publications:
    output: false

defaults:
  - scope:
      path: ""
      type: "research"
    values:
      layout: null
  - scope:
      path: ""
      type: "talks"
    values:
      layout: null
  - scope:
      path: ""
      type: "publications"
    values:
      layout: null
  - scope:
      path: ""
    values:
      layout: "page"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - node_modules
  - vendor
  - tools
