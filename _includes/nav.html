<nav class="site-nav">
  <div class="site-nav__inner">
    <a href="{{ '/' | relative_url }}" class="site-nav__brand">{{ site.author }}</a>
    <ul class="site-nav__links">
      {% for item in site.nav %}
        <li>
          <a href="{{ item.url | relative_url }}"
             {% if page.url == item.url %}class="active"{% endif %}>{{ item.title }}</a>
        </li>
      {% endfor %}
    </ul>
  </div>
</nav>
