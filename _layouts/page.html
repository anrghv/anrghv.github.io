---
layout: default
---
<div class="wrap">
  <header class="page-header">
    {% if page.eyebrow %}<span class="page-header__eyebrow">{{ page.eyebrow }}</span>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.lead %}<p class="page-header__lead">{{ page.lead }}</p>{% endif %}
  </header>
  <article>
    {{ content }}
  </article>
</div>
